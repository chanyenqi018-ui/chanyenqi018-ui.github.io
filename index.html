<style>
:root{--blue:#33478F;--peach:#F1A878;--canvas:#F7F6F3;--warm:#FFF1E8;--accent:#93532E;--ink:#18213A;--mute:#5E6880;--line:rgba(51,71,143,.12);
--serif:"Gelasio",Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:var(--sans);line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;
background:radial-gradient(700px 480px at 90% -60px,rgba(241,168,120,.38),rgba(241,168,120,0) 70%),radial-gradient(640px 520px at -10% 22%,rgba(212,220,247,.8),rgba(212,220,247,0) 70%),linear-gradient(180deg,var(--canvas),var(--warm) 65%,var(--canvas));background-attachment:fixed}
main{max-width:480px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 20px calc(36px + env(safe-area-inset-bottom))}
a{color:inherit}
.hero{text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:4px solid #fff;box-shadow:0 0 0 3px var(--peach),0 18px 40px -12px rgba(147,83,46,.45)}
h1{font-family:var(--serif);font-weight:500;font-size:34px;margin:18px 0 4px;letter-spacing:-.02em;color:var(--blue)}
.role{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
.tag{margin:10px auto 0;max-width:300px;color:var(--mute);font-size:14.5px;line-height:1.45}
.social{display:flex;justify-content:center;gap:14px;margin:22px 0 0}
.social a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px var(--line),0 8px 18px -12px rgba(34,49,106,.4);transition:transform .15s}
.social a:hover,.social a:focus-visible{transform:translateY(-2px);outline:none;box-shadow:0 0 0 1.5px var(--blue)}
.social svg{width:22px;height:22px;display:block}
.links{margin:26px 0 0;display:grid;gap:12px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;min-height:60px;padding:12px 56px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px var(--line),0 10px 24px -16px rgba(34,49,106,.35);border-radius:999px;color:var(--ink);text-decoration:none;text-align:center;transition:transform .15s,box-shadow .15s}
.btn:hover,.btn:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 1.5px var(--blue),0 14px 28px -16px rgba(34,49,106,.4);outline:none}
.btn .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.btn .ic svg{width:22px;height:22px;display:block}
.btn b{font-weight:600;font-size:16px}
footer{text-align:center;color:var(--mute);font-size:12.5px;margin-top:34px}
@media (min-width:700px){main{padding-top:64px}}
</style>
